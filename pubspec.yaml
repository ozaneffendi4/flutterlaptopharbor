name: laptopharbor
description: "Laptop Harbor App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  font_awesome_flutter: ^10.7.0
  lottie: ^3.3.1
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.8
  animated_bottom_navigation_bar: ^1.4.0
  image_picker: ^1.2.0
  flutter_rating_bar: ^4.0.1

  # Firebase dependencies compatible with Flutter 3.8
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Google.png
    - assets/Apple.png
    - assets/FaceBook.png
    - assets/Onboarding.json
